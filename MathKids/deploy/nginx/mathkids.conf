# /etc/nginx/sites-available/mathkids — MathKids on hexcode.win (www redirects to the apex domain).
# TLS: Cloudflare Origin Certificate, SSL mode "Full (strict)".
# Real visitor IP: /etc/nginx/conf.d/cloudflare-realip.conf (created by cloudflare-setup.sh).

server {
    listen 80;
    listen [::]:80;
    server_name hexcode.win www.hexcode.win;
    return 301 https://hexcode.win$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hexcode.win;

    ssl_certificate     /etc/ssl/cloudflare/mathkids.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mathkids.key;
    return 301 https://hexcode.win$request_uri;
}

server {
    # Ubuntu 24.04 ships Nginx 1.24, which still uses the "listen ... http2" syntax.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hexcode.win;

    ssl_certificate     /etc/ssl/cloudflare/mathkids.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mathkids.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/mathkid/MathKids/frontend/dist;
    index index.html;

    # Avatars are sent as base64 JSON (backend limit 7 MB).
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # Vite output has hashed file names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router (BrowserRouter): unknown paths fall back to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
